# Cargo workspace of PROJECT spacetimes, folder Revision_Lord_Gravity (task C23: the gravitational coupling of the
# brochon by E. A. Lord's gauge theory).
#
# Pure Rust: no crate is downloaded.  The members use the standard library, the library lgcore of this workspace and,
# for every numerical integration of an ordinary differential equation (from stage 5 on), the pure-Rust SUNDIALS 7.8.0
# vendored in the folder vendor/sundials_rs-7.8.0 of PROJECT spacetimes: the crate lgsundials (CVODE with a plain
# interface of real vectors) and its C interface lgsundials_c, a shared library through which the Python programs of
# the folder python/ use the same integrator.
#
# Build everything (from this folder, Revision_Lord_Gravity/rust):
#     cargo build --release
# The programs are then in target/release/ (lg_lord, lg_curved, lg_schw), with the library liblgsundials_c.so (Linux)
# or liblgsundials_c.dylib (macOS).  Each program writes its data files and the report of its checks into the folder
# data/ of Revision_Lord_Gravity.
[workspace]
members = ["lgcore", "lglord", "lgcurved", "lgsundials", "lgsundials_c", "lgschw"]
resolver = "2"

[profile.release]
opt-level = 3
debug = false

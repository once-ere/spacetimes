# Cargo workspace of PROJECT spacetimes, folder Revision_Lord_Gravity (task C23: the gravitational coupling of the
# brochon by E. A. Lord's gauge theory).
#
# Pure Rust: no crate is downloaded.  Every member uses only the standard library and the library lgcore of this
# workspace (later stages add the pure-Rust SUNDIALS 7.8.0 vendored in the folder vendor/sundials_rs-7.8.0 of PROJECT
# spacetimes, for every time integration).
#
# Build everything (from this folder, Revision_Lord_Gravity/rust):
#     cargo build --release
# The programs are then in target/release/ (lg_lord, ...).  Each writes its data files and the report of its checks
# into the folder data/ of Revision_Lord_Gravity.
[workspace]
members = ["lgcore", "lglord"]
resolver = "2"

[profile.release]
opt-level = 3
debug = false

# lgsundials_c: the C interface of the integrator CVODE of the crate lgsundials, through which the Python programs of the
# folder python/ use the same pure-Rust SUNDIALS 7.8.0 as the Rust programs (a copy of the CVODE part of the crate
# sfsundials_c of the folder Revision_SM_Higgs, with the names of the functions changed from sfs_ to lgs_).
[package]
name = "lgsundials_c"
version = "0.1.0"
edition = "2021"
description = "C interface of CVODE (SUNDIALS 7.8.0, pure Rust) for the Python programs of Revision_Lord_Gravity"

# a shared library with the C calling convention: liblgsundials_c.so (Linux), liblgsundials_c.dylib (macOS)
[lib]
name = "lgsundials_c"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
lgsundials = { path = "../lgsundials" }

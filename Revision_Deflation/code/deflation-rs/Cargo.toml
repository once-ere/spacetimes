[package]
name = "spacetimes-deflation"
version = "0.1.0"
edition = "2021"
description = "PROJECT spacetimes, Revision_Deflation: the 16-component Dirac fields, the Vorton-Scalar and the singlet superfluid on the 4+4 and 7+1 spacetimes whose coordinates x5, x6, x7 deflate exponentially"
authors = ["Patrick Lee Nash"]
license = "GPL-3.0-or-later"

# The only dependency is the Rust program of the main project (two folders up),
# which supplies the real 16x16 Dirac matrices of the two notebooks, exact integer
# matrices, complex linear algebra, quadrature, root finding, the gap equation,
# the bound pair, the effective action and the cosmological solver.
# No crate is downloaded: the program builds offline with a Rust toolchain alone.
[dependencies]
spacetimes = { path = "../../../code/spacetimes-rs" }

[profile.release]
opt-level = 3
debug = false
overflow-checks = true     # exact rational arithmetic must never wrap silently

[[bin]]
name = "deflation"
path = "src/main.rs"

[lib]
# The formulas displayed in the documentation comments are not Rust code.
doctest = false

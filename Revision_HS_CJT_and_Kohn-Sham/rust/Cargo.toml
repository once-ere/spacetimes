# Cargo workspace of PROJECT spacetimes, folder Revision_HS_CJT_and_Kohn-Sham.
#
# Pure Rust: no crate is downloaded.  Every member uses only the standard library, the library sfcore of this
# workspace, and the pure-Rust SUNDIALS 7.8.0 vendored in the folder vendor/sundials_rs-7.8.0 of PROJECT spacetimes
# (a copy of the folder sundials_rs of the author's repository rustSolveIt_macos-silicon_SUNDIALS_7_8_0): the
# integrators CVODE and IDA.
#
# Build everything (from this folder, Revision_HS_CJT_and_Kohn-Sham/rust):
#     cargo build --release
# The programs are then in target/release/ (sf_part1, ...), together with the shared library libsfsundials
# (.so on Linux, .dylib on macOS) of the member sfsundials_c: the C interface of CVODE and IDA through which the Python
# programs of the folder python/ integrate with the same pure-Rust SUNDIALS.
[workspace]
members = ["sfcore", "sfpart1", "sfpart2"]
resolver = "2"

[profile.release]
opt-level = 3
debug = false

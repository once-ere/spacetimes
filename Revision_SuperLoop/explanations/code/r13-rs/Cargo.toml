[package]
name = "spacetimes-superloop-r13"
version = "0.1.0"
edition = "2021"
description = "PROJECT spacetimes, Revision_SuperLoop, folder explanations: the 3+1 manifold R^(1,3)_LL of the Lorentz super-loop (coordinates, metric, the Lorentz group SL(2,C) acting on it, worked examples) and the renormalizability of the Yukawa form of the spin-zero superfluid on it (mass dimensions, power counting, the one-loop bubble and its renormalization)"
authors = ["Patrick Lee Nash"]
license = "GPL-3.0-or-later"

# The only dependency is the Rust program of the main project (four folders up), which
# supplies complex numbers, complex matrices, Gauss-Legendre rules and the CSV writer.
# No crate is downloaded: the program builds offline with a Rust toolchain alone.
[dependencies]
spacetimes = { path = "../../../../code/spacetimes-rs" }

[profile.release]
opt-level = 3
debug = false
overflow-checks = true

[[bin]]
name = "r13_yukawa"
path = "src/main.rs"

# Cargo workspace of PROJECT spacetimes, Revision_SuperLoop, folder test2.
# Pure Rust: no crate is downloaded; every member uses only the standard library and t2core.
#
# Build everything (from this folder):   cargo build --release
# The binaries are then in target/release/.
[workspace]
members = ["t2core", "t2fields", "t2analytic", "t2solve", "t2plot", "t2sfbs"]
resolver = "2"

[profile.release]
opt-level = 3
debug = false
